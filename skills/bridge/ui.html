<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bridge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9A%93</text></svg>">
<style>
  :root {
    --bg: #0b0f14; --bg2: #10161d; --panel: #141c25; --panel2: #1a2431;
    --line: #223041; --text: #d7e1ea; --dim: #7b8a99; --faint: #55636f;
    --accent: #4cc2ff; --accent2: #2b8fc4;
    --ok: #2fbf71; --warn: #e2b93b; --danger: #e25555; --info: #4cc2ff; --neutral: #66788a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* header */
  header {
    display: flex; align-items: baseline; gap: 12px; flex: none;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--bg2), var(--bg));
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  header .subtitle { color: var(--dim); font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status-dot { font-size: 12px; align-self: center; flex: none; cursor: default; white-space: nowrap; }
  #filter-wrap { display: flex; align-items: center; gap: 6px; align-self: center; flex: 1 1 auto; max-width: 560px; min-width: 140px; }
  #filter {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; color: var(--text);
    font: inherit; font-size: 13.5px; padding: 7px 12px; outline: none;
  }
  #filter:focus { border-color: var(--accent2); }
  #filter-age {
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px; color: var(--dim);
    font: inherit; font-size: 11.5px; padding: 6px 4px; max-width: 110px; cursor: pointer; outline: none; flex: none;
  }
  #filter-age:hover, #filter-age:focus { border-color: var(--accent2); }
  #filter-n { color: var(--dim); font-size: 11px; white-space: nowrap; }
  #filter-chips { display: flex; gap: 5px; align-items: center; flex: none; max-width: 40%; overflow: hidden; }
  .fchip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 9px;
    border-radius: 10px; background: var(--accent2); color: #eaf6ff; cursor: pointer; white-space: nowrap;
  }
  .fchip:hover { background: var(--accent); color: #06222f; }
  .fchip .x { font-size: 10px; opacity: .8; }
  #filter-clear { display: none; background: none; border: none; color: var(--dim); cursor: pointer; font: inherit; font-size: 12px; padding: 0 2px; }
  #filter-clear:hover { color: var(--text); }
  #gear {
    background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--dim);
    padding: 3px 8px; cursor: pointer; font: inherit; font-size: 13px; align-self: center;
  }
  #gear:hover, #gear.on { color: var(--accent); border-color: var(--accent2); }

  /* settings panel (behind the gear) */
  #settings-panel {
    position: fixed; top: 48px; right: 12px; z-index: 40; display: none; flex-direction: column; gap: 10px;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    width: min(320px, 92vw); box-shadow: 0 12px 30px rgba(0,0,0,.5);
  }
  #settings-panel.open { display: flex; }
  .sp-row { display: flex; gap: 6px; align-items: center; }
  .sp-title {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
    color: var(--faint); margin-top: 2px;
  }
  #voice-btn {
    background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--dim);
    padding: 3px 9px; cursor: pointer; font: inherit; font-size: 13px;
  }
  #voice-btn.on { color: var(--accent); border-color: var(--accent2); }
  #voice-tools { display: flex; gap: 6px; align-items: center; flex: 1; min-width: 0; transition: opacity .2s; }
  #voice-tools.dim { opacity: .5; }
  #voice-select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--dim);
    font: inherit; font-size: 12px; padding: 3px 6px; flex: 1; min-width: 0; cursor: pointer; outline: none;
  }
  #voice-test {
    background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--dim);
    padding: 3px 8px; cursor: pointer; font: inherit; font-size: 12px;
  }
  #voice-select:hover, #voice-test:hover { border-color: var(--accent2); color: var(--accent); }

  /* label manager */
  #lm-list { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; }
  .lm-row { display: flex; gap: 6px; align-items: center; }
  .lm-row input[type=color], #lm-color {
    width: 26px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px;
    background: none; cursor: pointer; flex: none;
  }
  .lm-row input[type=text], #lm-name {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    color: var(--text); font: inherit; font-size: 12px; padding: 2px 6px; outline: none;
  }
  .lm-row input[type=text]:focus, #lm-name:focus { border-color: var(--accent2); }
  .lm-row .lm-n { color: var(--faint); font-size: 10px; min-width: 14px; text-align: right; }
  .lm-row button { background: none; border: none; color: var(--faint); cursor: pointer; font: inherit; font-size: 12px; }
  .lm-row button:hover { color: var(--danger); }
  #lm-new { display: flex; gap: 6px; align-items: center; }
  #lm-new button {
    background: var(--accent2); border: none; border-radius: 4px; color: #eaf6ff;
    font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer;
  }
  #lm-new button:hover { background: var(--accent); color: #06222f; }

  /* label picker (card "+" and drawer "+ label") */
  #label-picker {
    position: fixed; z-index: 50; display: none; flex-direction: column; gap: 6px;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 8px;
    width: 210px; box-shadow: 0 10px 24px rgba(0,0,0,.5);
  }
  #label-picker.open { display: flex; }
  #lp-input {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; color: var(--text);
    font: inherit; font-size: 12px; padding: 4px 8px; outline: none;
  }
  #lp-input:focus { border-color: var(--accent2); }
  #lp-list { display: flex; flex-direction: column; gap: 2px; max-height: 180px; overflow-y: auto; }
  .lp-item { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .lp-item:hover { background: var(--panel2); }
  .lp-item .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .lp-item.create { color: var(--accent); }

  /* board: columns share the full viewport width; each scrolls internally under a fixed header */
  #board { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 16px 18px; overflow-x: auto; }
  .column { flex: 1 1 0; min-width: 280px; min-height: 0; display: flex; flex-direction: column; }
  .column h2 {
    flex: none; font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
    color: var(--dim); padding: 2px 4px 8px; display: flex; justify-content: space-between;
  }
  .column h2 .count { color: var(--faint); }
  .cards { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
  @media (max-width: 720px) {
    .column { flex: 0 0 min(320px, 85vw); } /* phone: fixed-width columns, swipe horizontally */
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; cursor: pointer; transition: border-color .15s;
  }
  .card:hover { border-color: var(--accent2); }
  .card.open { border-color: var(--accent); }
  .card .title { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
  .card .summary { color: var(--dim); font-size: 12.5px; margin: 4px 0; }
  .card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .card .ago { color: var(--faint); font-size: 11px; }
  .card .thread-n { color: var(--faint); font-size: 11px; }
  .card .meta-r { display: flex; gap: 8px; align-items: center; }
  .card .add-label {
    font-size: 12px; line-height: 1.2; color: var(--faint); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 6px; cursor: pointer; opacity: 0; transition: opacity .12s;
  }
  .card:hover .add-label { opacity: 1; }
  .card .add-label:hover { color: var(--accent); border-color: var(--accent2); }
  @media (hover: none) { .card .add-label { opacity: .6; } } /* touch: always visible */
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .badge { font-size: 10.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid; }
  .badge.success { color: var(--ok); border-color: var(--ok); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.danger { color: var(--danger); border-color: var(--danger); }
  .badge.info { color: var(--info); border-color: var(--info); }
  .badge.neutral { color: var(--neutral); border-color: var(--neutral); }
  .label { font-size: 10.5px; padding: 1px 7px; border-radius: 4px; background: var(--panel2); border: 1px dashed var(--faint); color: var(--dim); }
  .badge, .label { cursor: pointer; }
  .badge.active, .label.active { background: var(--accent2); color: #eaf6ff; border-color: var(--accent2); border-style: solid; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; font-size: 12px; }
  .owner-head {
    display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; color: var(--faint); margin: 6px 2px 2px;
  }
  .owner-head .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .owner-head[data-owner]:not([data-owner=""]) { cursor: pointer; }
  .owner-head:not([data-owner=""]):hover, .owner-head.active { color: var(--text); }
  #d-owner { font-size: 10.5px; padding: 1px 8px; border-radius: 10px; border: 1px solid; align-self: center; white-space: nowrap; cursor: pointer; }
  .empty { color: var(--faint); padding: 40px; text-align: center; width: 100%; }

  /* drawer */
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 92vw);
    background: var(--bg2); border-left: 1px solid var(--line);
    display: none; flex-direction: column; z-index: 20; box-shadow: -12px 0 30px rgba(0,0,0,.5);
  }
  #drawer.open { display: flex; }
  #drawer .d-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  #drawer .d-head .title { font-size: 15px; font-weight: 600; flex: 1; }
  #drawer .d-close { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; }
  #drawer .d-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
  #drawer .d-detail { border-bottom: 1px dashed var(--line); padding-bottom: 12px; margin-bottom: 12px; }
  #drawer .d-detail .badges { margin: 8px 0 4px; }
  #drawer .d-detail .d-none { color: var(--faint); }
  #d-labels { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-bottom: 1px dashed var(--line); padding-bottom: 12px; margin-bottom: 12px; }
  .dlabel {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 8px;
    border-radius: 4px; background: var(--panel2); border: 1px dashed var(--faint); color: var(--dim);
  }
  .dlabel button { background: none; border: none; color: var(--faint); cursor: pointer; font: inherit; font-size: 10px; padding: 0; }
  .dlabel button:hover { color: var(--danger); }
  #d-label-add {
    background: var(--panel); border: 1px dashed var(--line); border-radius: 4px; color: var(--dim);
    font: inherit; font-size: 11px; padding: 2px 8px; cursor: pointer; outline: none;
  }
  #d-label-add:hover, #d-label-add:focus { border-color: var(--accent2); color: var(--accent); }

  /* markdown */
  .md h1, .md h2, .md h3 { margin: 10px 0 5px; line-height: 1.25; }
  .md h1 { font-size: 15px; } .md h2 { font-size: 14px; } .md h3 { font-size: 13.5px; }
  .md p { margin: 6px 0; }
  .md ul { margin: 6px 0 6px 20px; }
  .md li { margin: 2px 0; }
  .md code { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
  .md pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: 8px 0; }
  .md pre code { background: none; border: none; padding: 0; }

  /* threads */
  .thread { display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 86%; padding: 7px 11px; border-radius: 10px; font-size: 13px; }
  .msg.agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
  .msg.user { align-self: flex-end; background: #1d3a52; border: 1px solid #2b5578; border-bottom-right-radius: 3px; }
  .msg .ts { display: block; color: var(--faint); font-size: 10px; margin-top: 3px; }
  .msg .pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.typing { display: flex; align-items: center; gap: 4px; }
  .msg.typing .tdot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: typing-blink 1.2s infinite; }
  .msg.typing .tdot:nth-child(2) { animation-delay: .2s; }
  .msg.typing .tdot:nth-child(3) { animation-delay: .4s; }
  .msg.typing .lbl { color: var(--faint); font-size: 11px; margin-left: 4px; }
  @keyframes typing-blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: flex-end; }
  .composer textarea {
    flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); padding: 7px 10px; font: inherit; font-size: 13px; outline: none;
    resize: none; max-height: 120px; overflow-y: auto; line-height: 1.4;
  }
  .composer textarea:focus { border-color: var(--accent2); }
  .composer button {
    background: var(--accent2); border: none; border-radius: 6px; color: #eaf6ff;
    padding: 7px 14px; cursor: pointer; font: inherit; font-size: 13px;
  }
  .composer button:hover { background: var(--accent); color: #06222f; }

  /* chat dock */
  #chat-dock { position: fixed; right: 18px; bottom: 0; width: min(400px, 92vw); z-index: 15; }
  #chat-toggle {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); border-bottom: none;
    border-radius: 10px 10px 0 0; color: var(--text); padding: 8px 14px; cursor: pointer;
    font: inherit; font-size: 13px; text-align: left; display: flex; justify-content: space-between;
  }
  #chat-toggle .n { color: var(--accent); }
  #chat-panel { display: none; flex-direction: column; height: 380px; background: var(--bg2); border: 1px solid var(--line); border-bottom: none; }
  #chat-dock.open #chat-panel { display: flex; }
  #chat-thread { flex: 1; overflow-y: auto; padding: 12px; }
</style>
</head>
<body>
<header>
  <h1 id="b-title">bridge</h1>
  <div class="subtitle" id="b-subtitle"></div>
  <span id="filter-wrap">
    <span id="filter-chips"></span>
    <input id="filter" placeholder="type to filter ( / )" autocomplete="off">
    <select id="filter-age" title="only cards updated recently">
      <option value="">any time</option>
      <option value="3600">last hour</option>
      <option value="today">today</option>
      <option value="259200">last 3 days</option>
      <option value="604800">last week</option>
    </select>
    <span id="filter-n"></span>
    <button id="filter-clear" title="clear filter">✕</button>
  </span>
  <span id="status-dot" title="connecting…">🔴</span>
  <button id="gear" title="settings">⚙️</button>
</header>

<div id="settings-panel">
  <div class="sp-title">voice</div>
  <div class="sp-row">
    <button id="voice-btn" title="speak new agent messages">🔊 off</button>
    <span id="voice-tools" class="dim">
      <select id="voice-select" title="TTS voice"></select>
      <button id="voice-test" title="test the selected voice">▶</button>
    </span>
  </div>
  <div class="sp-title">labels</div>
  <div id="lm-list"></div>
  <form id="lm-new">
    <input id="lm-color" type="color" value="#4cc2ff" title="label color">
    <input id="lm-name" placeholder="new label…" autocomplete="off">
    <button type="submit">add</button>
  </form>
</div>

<div id="label-picker">
  <input id="lp-input" placeholder="add label…" autocomplete="off">
  <div id="lp-list"></div>
</div>

<div id="board"><div class="empty">waiting for board…</div></div>

<aside id="drawer">
  <div class="d-head">
    <div class="title" id="d-title"></div>
    <span id="d-owner" style="display:none"></span>
    <button class="d-close" id="d-close" title="close">✕</button>
  </div>
  <div class="d-body" id="d-body">
    <div class="d-detail md" id="d-detail"></div>
    <div id="d-labels"></div>
    <div class="thread" id="d-thread"></div>
  </div>
  <form class="composer" id="d-form">
    <textarea id="d-input" rows="1" placeholder="message this card…" autocomplete="off"></textarea>
    <button type="submit">send</button>
  </form>
</aside>

<div id="chat-dock">
  <button id="chat-toggle"><span>💬 chat</span><span class="n" id="chat-n"></span></button>
  <div id="chat-panel">
    <div id="chat-thread" class="thread"></div>
    <form class="composer" id="chat-form">
      <textarea id="chat-input" rows="1" placeholder="message the agent…" autocomplete="off"></textarea>
      <button type="submit">send</button>
    </form>
  </div>
</div>

<script>
'use strict';
// ---------- state ----------
let doc = null;
let openCardId = null;
let voiceOn = false;
let firstLoad = true;
const seenMsgs = new Set();
let awaiting = new Set(); // targets awaiting an agent reply (from server status events)
let sseConnected = false;

// ---------- utils ----------
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function ago(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}
function hhmm(iso) {
  try { return new Date(iso).toTimeString().slice(0, 5); } catch (e) { return ''; }
}

// ---------- tiny markdown renderer (escape-first; no HTML injection) ----------
function mdInline(s) {
  return s
    .replace(/`([^`]+)`/g, function (_, c) { return '<code>' + c + '</code>'; })
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = esc(src || '').split('\n');
  let out = '', inCode = false, inList = false, para = [];
  function flushPara() { if (para.length) { out += '<p>' + mdInline(para.join(' ')) + '</p>'; para = []; } }
  function closeList() { if (inList) { out += '</ul>'; inList = false; } }
  for (const line of lines) {
    if (/^```/.test(line)) {
      flushPara(); closeList();
      out += inCode ? '</code></pre>' : '<pre><code>';
      inCode = !inCode; continue;
    }
    if (inCode) { out += line + '\n'; continue; }
    const h = /^(#{1,3})\s+(.*)/.exec(line);
    if (h) { flushPara(); closeList(); out += '<h' + h[1].length + '>' + mdInline(h[2]) + '</h' + h[1].length + '>'; continue; }
    const li = /^\s*[-*]\s+(.*)/.exec(line);
    if (li) { flushPara(); if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + mdInline(li[1]) + '</li>'; continue; }
    if (!line.trim()) { flushPara(); closeList(); continue; }
    para.push(line);
  }
  flushPara(); closeList();
  if (inCode) out += '</code></pre>';
  return out;
}

// ---------- voice ----------
const VOICE_KEY = 'bridge-voice';
const voiceSelect = document.getElementById('voice-select');
let voices = [];
let voiceFilter = null; // lowercase substrings from /api/config, or null = no filter

fetch('/api/config').then((r) => r.json()).then((cfg) => {
  if (cfg && Array.isArray(cfg.voices) && cfg.voices.length) {
    voiceFilter = cfg.voices.map((s) => String(s).toLowerCase());
  }
  if (voices.length) populateVoicePicker();
}).catch(function () {});

function savedVoice() {
  try { return JSON.parse(localStorage.getItem(VOICE_KEY)); } catch (e) { return null; }
}
function voiceRank(v) {
  if (/^pt[-_]BR/i.test(v.lang)) return 0;
  if (/^pt/i.test(v.lang)) return 1;
  if (/^en/i.test(v.lang)) return 2;
  return 3;
}
function populateVoicePicker() {
  let sorted = voices.slice().sort((a, b) =>
    voiceRank(a) - voiceRank(b) || a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));
  if (voiceFilter) {
    const matches = (v) => voiceFilter.some((f) => v.name.toLowerCase().includes(f));
    if (sorted.some(matches)) { // zero matches = fall back to full list

  def.value = '';

  voiceSelect.appendChild(def);
  for (const v of sorted) {

    o.textContent = v.name + ' (' + v.lang + ')';

function loadVoices() {

}
function selectedVoice() {

// ---------- message tracking (speak only NEW agent messages) ----------

function trackMessages() {
  if (!doc) return;

  (doc.cards || []).forEach((c) => (c.thread || []).forEach((m) => all.push(['card:' + c.id, m])));
  for (const [scope, m] of all) {
    const k = msgKey(scope, m);
    if (!seenMsgs.has(k)) {

// ---------- render ----------
function renderThread(el, thread, target) {
  const pinned = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.textContent = '';
  for (const m of thread || []) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (m.author === 'user' ? 'user' : 'agent');
    const body = document.createElement('div');
    if (m.author === 'user') {
      body.className = 'md pre';
      body.textContent = m.text; // user text: verbatim, line breaks kept via pre-wrap
    } else {
      body.className = 'md';
      body.innerHTML = md(m.text); // agent text: escape-first markdown

    const ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = m.author + ' · ' + hhmm(m.ts);
    wrap.append(body, ts);
    el.appendChild(wrap);

  if (target && awaiting.has(target)) {
    const t = document.createElement('div');
    t.className = 'msg agent typing';

// ---------- owners ----------
const OWNER_PALETTE = ['#4cc2ff', '#2fbf71', '#e2b93b', '#c678dd', '#e2795b', '#56b6c2', '#98c379', '#e06c75'];

function render() {
  if (!doc) return;
  document.title = doc.title || 'bridge';
  document.getElementById('b-title').textContent = doc.title || 'bridge';
  document.getElementById('b-subtitle').textContent = doc.subtitle || '';

  // preserve scroll positions
  const boardEl = document.getElementById('board');
  const sx = boardEl.scrollLeft;
  const colScroll = {};
  boardEl.querySelectorAll('.column').forEach((col) => {
    colScroll[col.dataset.id] = col.querySelector('.cards').scrollTop;
  });

  const cols = doc.columns || [];
  if (!cols.length) {
    boardEl.innerHTML = '<div class="empty">no columns yet — agent hasn\'t synced a board</div>';
  } else {
    const multiOwner = boardMultiOwner();
    boardEl.innerHTML = cols.map((col) => {
      // most-recently-updated first; owner grouping stays the outer order (groups
      // form in recency order too, and cards sort within each group)
      const cards = (doc.cards || []).filter((c) => c.column === col.id).sort(byRecency);
      let inner;
      if (multiOwner && new Set(cards.map((c) => c.owner || '')).size > 1) {
        const order = [], groups = {};
        cards.forEach((c) => {
          const k = c.owner || '';
          if (!(k in groups)) { groups[k] = []; order.push(k); }
          groups[k].push(c);
        });
        inner = order.map((k) =>
          ownerHeadHtml(k) + groups[k].map((c) => cardHtml(c, true)).join('')).join('');
      } else {
        inner = cards.map((c) => cardHtml(c, multiOwner)).join('');

  // keep the open label picker / settings panel in step with fresh board data
  if (pickerCardId) renderPicker();
  const sp = document.getElementById('settings-panel');
  if (sp.classList.contains('open')) renderLabelManager();

  applyFilter();
}

// ---------- label picker (card "+" and drawer "+ label"; autocomplete over the registry) ----------
const lpEl = document.getElementById('label-picker');

// ---------- filter (pure client-side; re-applied after every render) ----------
const filterInput = document.getElementById('filter');

  renderChips();
  render(); // re-render so active highlights update; render() ends in applyFilter()
}

    chip.className = 'fchip';

function cardHaystack(c) {
  const col = ((doc && doc.columns) || []).find((k) => k.id === c.column);
  return [c.title, c.id, c.summary, c.owner,
    (c.badges || []).map((b) => b.text).join(' '),
    (c.labels || []).join(' '),
    (c.links || []).map((l) => l.text + ' ' + l.url).join(' '),
    col ? (col.title || col.id) : (c.column || '')
  ].filter(Boolean).join(' ').toLowerCase();
}
function applyFilter() {
  const q = filterInput.value.trim().toLowerCase();
  const cutoff = ageCutoff();
  const active = q || selFilters.length || cutoff;
  const boardEl = document.getElementById('board');
  let shown = 0, total = 0;
  boardEl.querySelectorAll('.card').forEach((el) => {
    total++;
    const c = ((doc && doc.cards) || []).find((x) => x.id === el.dataset.id);
    const recent = !cutoff || (c && c.updated && new Date(c.updated).getTime() >= cutoff);
    const ok = !active || (c && (!q || cardHaystack(c).includes(q)) && matchesSel(c) && recent);
    el.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  // hide owner group headers whose cards are all filtered out
  boardEl.querySelectorAll('.cards').forEach((wrap) => {
    let head = null, any = false;
    for (const child of wrap.children) {
      if (child.classList.contains('owner-head')) {
        if (head) head.style.display = any ? '' : 'none';
        head = child; any = false;
      } else if (child.classList.contains('card') && child.style.display !== 'none') any = true;
    }
    if (head) head.style.display = any ? '' : 'none';
  });
  document.getElementById('filter-n').textContent = active ? shown + '/' + total : '';
  document.getElementById('filter-clear').style.display = active ? 'inline' : 'none';
}
function clearFilter() {
  filterInput.value = '';
  filterAge.value = '';
  if (selFilters.length) { selFilters = []; renderChips(); render(); } // render() ends in applyFilter()
  else applyFilter();
}
filterInput.oninput = applyFilter;
filterAge.onchange = applyFilter;
filterInput.onkeydown = function (e) {
  if (e.key === 'Escape') { clearFilter(); filterInput.blur(); e.stopPropagation(); }
};
document.getElementById('filter-clear').onclick = clearFilter;

document.addEventListener('keydown', (e) => {
  const active = document.activeElement;
  if (e.key === '/' && active !== filterInput && !/^(INPUT|TEXTAREA|SELECT)$/.test((active && active.tagName) || '')) {
    e.preventDefault(); filterInput.focus(); return;
  }
  if (e.key === 'Escape') {
    if (spEl.classList.contains('open')) { spEl.classList.remove('open'); gearBtn.classList.remove('on'); }
    else if (pickerCardId) closeLabelPicker();
    else if (openCardId) closeDrawer();
    else if (filterInput.value || selFilters.length || filterAge.value) clearFilter();
  }
});

// ---------- feedback ----------
async function sendFeedback(target, text) {
  if (!text.trim()) return;
  await fetch('/api/feedback', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ target, text: text.trim() }),
  });
}
// multiline composers: Enter sends, Shift+Enter = newline, Cmd/Ctrl+Enter also sends;
// auto-grow to max-height then scroll, reset to one line after send
function autoGrow(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
function wireComposer(t, send) {
  t.oninput = () => autoGrow(t);
  t.onkeydown = (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey || !e.shiftKey)) { e.preventDefault(); send(); }
  };
}
const dInput = document.getElementById('d-input');
const chatInput = document.getElementById('chat-input');
function sendDrawerMsg() {
  if (openCardId) sendFeedback('card:' + openCardId, dInput.value);
  dInput.value = ''; autoGrow(dInput);
}
function sendChatMsg() {
  sendFeedback('chat', chatInput.value);
  chatInput.value = ''; autoGrow(chatInput);
}
wireComposer(dInput, sendDrawerMsg);
wireComposer(chatInput, sendChatMsg);
document.getElementById('d-form').onsubmit = function (e) { e.preventDefault(); sendDrawerMsg(); };
document.getElementById('chat-form').onsubmit = function (e) { e.preventDefault(); sendChatMsg(); };
document.getElementById('chat-toggle').onclick = function () {
  document.getElementById('chat-dock').classList.toggle('open');
  const t = document.getElementById('chat-thread');
  t.scrollTop = t.scrollHeight;
};

// ---------- SSE ----------
function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('board', (e) => {
    doc = JSON.parse(e.data);
    trackMessages();
    render();
  });
  es.addEventListener('status', (e) => {
    const st = JSON.parse(e.data);
    awaiting = new Set(st.awaiting || []);
    updateStatusDot();
    render();
  });
  es.onopen = () => { sseConnected = true; updateStatusDot(); };
  es.onerror = () => { sseConnected = false; updateStatusDot(); };
}
connect();
updateStatusDot();
setInterval(render, 60000); // refresh "ago" labels
</script>
